server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicitly handle static assets in /assets/ directory
    # This prevents returning index.html for missing assets, which causes MIME errors
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Handle errors
    error_page 404 /index.html;
}
