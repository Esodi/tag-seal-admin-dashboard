# Netlify configuration for Vite React app

[build]
  # Build command - compiles TypeScript and builds the Vite app
  command = "npm run build"
  # Output directory - Vite outputs to 'dist' by default
  publish = "dist"

# Environment variables for the build
[build.environment]
  # Use Node.js 20 for compatibility with Vite
  NODE_VERSION = "20"

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
